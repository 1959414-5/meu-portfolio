    <script>
        try {
            const savedTheme = localStorage.getItem('portfolio-theme');
            document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');

            document.documentElement.setAttribute('data-theme', 'dark');
        }

    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @layer theme {
        :root {
            color-scheme: light;
            --bg-color: #fff7fa;
            --surface-color: rgba(255, 255, 255, 0.94);
            --card-color: #ffffff;
            --inner-card-color: #fff0f5;
            --section-alt-color: #f8eaf1;
            --surface-border: rgba(194, 24, 91, 0.15);
            --primary-color: #c2185b;
            --primary-hover: #a9144c;
            --text-main: #2a1522;
            --text-muted: #765f6d;
            --shadow-color: rgba(85, 24, 54, 0.08);
            --page-glow-a: rgba(236, 72, 153, 0.10);
            --page-glow-b: rgba(190, 24, 93, 0.06);
            --section-wash: rgba(194, 24, 91, 0.025);
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --bg-color: #150f18;
            --surface-color: rgba(34, 25, 39, 0.84);
            --card-color: rgba(42, 30, 49, 0.97);
            --inner-card-color: #35263d;
            --section-alt-color: #1e1423;
            --surface-border: rgba(255, 255, 255, 0.09);
            --primary-color: #f15aa7;
            --primary-hover: #dc3f8d;
            --text-main: #fbf4fa;
            --text-muted: #bbaebb;
            --shadow-color: rgba(0, 0, 0, 0.30);
            --page-glow-a: rgba(241, 90, 167, 0.12);
            --page-glow-b: rgba(124, 58, 237, 0.10);
            --section-wash: rgba(241, 90, 167, 0.035);
        }
    }

    @layer base {
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(ellipse at 12% 4%, var(--page-glow-a), transparent 42%),
                radial-gradient(ellipse at 92% 24%, var(--page-glow-b), transparent 38%);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
            transition: background-color 200ms ease, color 200ms ease;
            -webkit-font-smoothing: antialiased;
        }
        ::selection {
            background-color: var(--primary-color);
            color: white;
        }
    }

    @layer components {
        .inner-card {
            background-color: var(--inner-card-color);
            transition: background-color 200ms ease;
        }
        .glass-panel {
            background-color: var(--card-color);
            backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 1.25rem;
            box-shadow: 0 18px 48px var(--shadow-color);
            transition: background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
        }
        .btn-primary {
            @apply px-6 py-3 bg-[var(--primary-color)] hover:bg-[var(--primary-hover)] text-white font-medium rounded-lg transition-all duration-300 transform hover:-translate-y-1 shadow-[0_4px_14px_0_rgba(14,165,233,0.39)];
        }
        .btn-outline {
            @apply px-6 py-3 border border-[var(--surface-border)] hover:border-[var(--primary-color)] text-[var(--text-main)] font-medium rounded-lg transition-all duration-300 backdrop-blur-md;
        }
        .section-title {
            @apply text-3xl md:text-4xl font-bold mb-10 text-left bg-clip-text text-transparent bg-gradient-to-r from-[var(--text-main)] to-[var(--primary-color)];
        }
        .nav-link {
            @apply text-sm text-[var(--text-muted)] hover:text-white transition-colors cursor-pointer;
        }
    }

    @layer utilities {
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--page-glow-a) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    }

    html { scroll-behavior: smooth; font-size: 14.5px; }
    body { margin: 0; width: 100%; min-width: 320px; overflow-x: hidden; }
    #root { width: 100%; min-width: 0; }
    .container.mx-auto {
        width: 100% !important;
        max-width: 1240px !important;
        margin-inline: auto !important;
        padding-inline: clamp(24px, 5vw, 84px) !important;
    }
    img, video, canvas, svg { max-width: 100%; }
    section[id] { scroll-margin-top: 6rem; }
    @media (max-width: 760px) {
        html { font-size: 13.8px; }
        .container.mx-auto { padding-inline: 18px !important; }
        .section-title { font-size: clamp(1.6rem, 5.5vw, 2rem) !important; margin-bottom: 1.5rem !important; }
        .glass-panel { border-radius: 1rem; }
    }
    @media (max-width: 380px) {
        .container.mx-auto { padding-inline: 15px !important; }
    }
    @media (min-width: 1500px) {
        .container.mx-auto { padding-inline: clamp(76px, 5.4vw, 96px) !important; }
    }
    @media (max-width: 760px) {
        .container.mx-auto { padding-inline: 18px !important; }
        .section-title { font-size: clamp(1.55rem, 4.8vw, 1.85rem) !important; }
    }
    @media (max-width: 380px) {
        html { font-size: 13.5px; }
        .container.mx-auto { padding-inline: 15px !important; }
    }
    .btn-primary { color: #fff !important; }
    .theme-toggle { color: var(--text-main); }
    html[data-theme="light"] .text-white { color: var(--text-main) !important; }
    html[data-theme="light"] .btn-primary,
    html[data-theme="light"] .btn-outline.text-white { color: #fff !important; }
    html[data-theme="dark"] .section-title {
        background-image: linear-gradient(120deg, #f8fafc 0%, #a4b2c7 100%);
    }
    summary::-webkit-details-marker { display: none; }
    .project-details[open] .project-details-icon { transform: rotate(45deg); }


    /* Correção de overflow horizontal em telas móveis */
    @media (max-width: 760px) {
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: clip !important;
        }
        #root, #root > div, main, section {
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        .container.mx-auto {
            box-sizing: border-box !important;
            width: 100% !important;
            max-width: 100% !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
            padding-left: clamp(16px, 5vw, 22px) !important;
            padding-right: clamp(16px, 5vw, 22px) !important;
        }
        #hero {
            overflow-x: clip !important;
        }
        #hero .container.mx-auto {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) !important;
            gap: 2rem !important;
        }
        #hero .container.mx-auto > div {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }
        #hero .container.mx-auto > div:first-child {
            text-align: center;
        }
        #hero h1, #hero p, #hero a, #hero button {
            max-width: 100%;
            overflow-wrap: anywhere;
        }
        #hero .container.mx-auto > div:first-child > div:first-child {
            display: inline-flex;
            max-width: 100%;
            white-space: normal;
            justify-content: center;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            scroll-behavior: auto !important;
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

    /* Identidade visual: referência Bárbara.BI */
    html { scroll-padding-top: 7rem; }
    body {
        background-image:
            radial-gradient(ellipse at 8% 2%, var(--page-glow-a), transparent 38%),
            radial-gradient(ellipse at 92% 26%, var(--page-glow-b), transparent 34%),
            linear-gradient(180deg, var(--bg-color), var(--bg-color));
        background-attachment: fixed;
    }
    h1, h2, h3, h4, .section-title, header .text-xl {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        letter-spacing: -0.025em;
    }
    h1 { letter-spacing: -0.045em; }
    .section-title {
        position: relative;
        display: inline-block;
        font-size: clamp(2rem, 3.2vw, 2.75rem) !important;
        line-height: 1.12 !important;
        margin-bottom: 2.1rem !important;
        background-image: linear-gradient(110deg, var(--text-main) 12%, var(--primary-color) 100%);
    }
    .section-title::after {
        content: "";
        display: block;
        width: 58px;
        height: 3px;
        margin-top: 13px;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--primary-color), transparent);
    }
    .glass-panel {
        background-color: var(--card-color);
        border: 1px solid var(--surface-border);
        border-radius: 1.2rem;
        box-shadow: 0 16px 42px var(--shadow-color);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: background-color .35s ease, border-color .35s ease, box-shadow .35s ease, transform .35s cubic-bezier(.2,.7,.2,1);
    }
    main > section:not(#hero) {
        position: relative;
        isolation: isolate;
    }
    main > section:not(#hero)::before {
        content: "";
        position: absolute;
        top: 0;
        left: max(22px, calc((100% - 1120px) / 2));
        right: max(22px, calc((100% - 1120px) / 2));
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--surface-border) 12%, var(--surface-border) 88%, transparent);
        pointer-events: none;
    }
    /* Faixas de fundo alternadas para dar ritmo visual à página inteira */
    main > section {
        transition: background-color .38s ease;
    }
    main > section:nth-of-type(even):not(#hero) {
        background-color: var(--section-alt-color);
        background-image:
            radial-gradient(ellipse at 8% 18%, var(--section-wash), transparent 44%),
            linear-gradient(115deg, color-mix(in srgb, var(--section-alt-color) 96%, transparent), var(--section-alt-color));
    }
    main .glass-panel:hover {
        border-color: color-mix(in srgb, var(--primary-color) 42%, var(--surface-border));
        box-shadow: 0 22px 52px var(--shadow-color), 0 0 0 1px color-mix(in srgb, var(--primary-color) 9%, transparent);
        transform: translateY(-4px);
    }
    .btn-primary {
        background: var(--primary-color) !important;
        box-shadow: 0 8px 24px color-mix(in srgb, var(--primary-color) 28%, transparent) !important;
        border-radius: 12px !important;
    }
    .btn-primary:hover {
        background: var(--primary-hover) !important;
        box-shadow: 0 12px 30px color-mix(in srgb, var(--primary-color) 34%, transparent) !important;
    }
    .btn-outline { border-radius: 12px !important; }
    .nav-link {
        position: relative;
        color: var(--text-muted) !important;
        padding: 8px 0;
    }
    .nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        right: 100%;
        bottom: 1px;
        height: 2px;
        border-radius: 5px;
        background: var(--primary-color);
        transition: right .25s ease;
    }
    .nav-link:hover::after, .nav-link.active-nav-link::after { right: 0; }
    .nav-link.active-nav-link { color: var(--primary-color) !important; }
    .theme-toggle {
        background: var(--surface-color) !important;
        border-color: var(--surface-border) !important;
    }
    #scroll-progress {
        position: fixed;
        z-index: 1000;
        inset: 0 auto auto 0;
        width: 100%;
        height: 3px;
        transform: scaleX(0);
        transform-origin: left center;
        background: linear-gradient(90deg, var(--primary-color), #f9a8d4, #c084fc);
        box-shadow: 0 0 14px color-mix(in srgb, var(--primary-color) 55%, transparent);
        pointer-events: none;
    }
    .scroll-reveal {
        opacity: 0;
        transform: translate3d(0, 22px, 0);
        transition: opacity .72s ease, transform .72s cubic-bezier(.2,.7,.2,1);
        transition-delay: var(--reveal-delay, 0ms);
    }
    .scroll-reveal.is-visible { opacity: 1; transform: translate3d(0,0,0); }
    section[id] { scroll-margin-top: 7rem; }
    @media (max-width: 760px) {
        main > section:not(#hero)::before { left: 18px; right: 18px; }
        main .glass-panel:hover { transform: none; }
        .section-title { margin-bottom: 1.5rem !important; }
        .scroll-reveal { transform: translate3d(0, 14px, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
        .scroll-reveal { opacity: 1; transform: none; transition: none; }
    }


    /* Marcas das tecnologias no destaque principal */
    .hero-tech-strip {
        min-height: 78px;
        padding-bottom: 18px;
        margin-bottom: 8px;
    }
    .tech-logo {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 8px;
        border-radius: 14px;
        border: 1px solid var(--surface-border);
        background: color-mix(in srgb, var(--card-color) 88%, transparent);
        box-shadow: 0 7px 18px var(--shadow-color);
        transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease;
        animation: technologyFloat 6.2s ease-in-out infinite;
        will-change: transform;
    }
    .tech-logo img {
        display: block;
        width: 30px;
        height: 30px;
        object-fit: contain;
        pointer-events: none;
    }
    .tech-logo--powerbi img { width: 23px; height: 31px; }
    .tech-logo--mysql img { width: 33px; height: 33px; }
    .tech-logo--python img { width: 30px; height: 30px; }
    .tech-logo--javascript {
        background: #f7df1e;
        border-color: rgba(247,223,30,.5);
    }
    .javascript-mark {
        display: inline-block;
        color: #242424 !important;
        font-family: Arial, Helvetica, sans-serif !important;
        font-size: 17px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -1.2px;
        transform: translate(1px, 2px);
        text-shadow: 0 1px 0 rgba(255,255,255,.16);
        opacity: 1 !important;
        visibility: visible !important;
    }
    .tech-logo--html img { width: 29px; height: 29px; }
    .tech-logo--css img { width: 29px; height: 29px; }
    .tech-logo--api img { width: 31px; height: 31px; }
    .tech-logo--powerbi { animation-delay: -0.8s; }
    .tech-logo--mysql { animation-delay: -1.6s; }
    .tech-logo--python { animation-delay: -2.4s; }
    .tech-logo--javascript { animation-delay: -3.2s; }
    .tech-logo--html { animation-delay: -4s; }
    .tech-logo--css { animation-delay: -4.8s; }
    .tech-logo--api { animation-delay: -5.6s; }
    .tech-logo:hover {
        transform: translateY(-6px) scale(1.08);
        border-color: color-mix(in srgb, var(--primary-color) 55%, var(--surface-border));
        box-shadow: 0 13px 26px var(--shadow-color), 0 0 18px color-mix(in srgb, var(--primary-color) 13%, transparent);
        animation-play-state: paused;
    }

    /* Elemento decorativo flutuante do card Sobre Mim */
    .about-orbit-decoration {
        position: absolute;
        top: 22px;
        right: 26px;
        width: 82px;
        height: 82px;
        z-index: 1;
        pointer-events: none;
        opacity: .9;
    }
    .about-orbit-ring {
        position: absolute;
        inset: 8px;
        border: 1px solid color-mix(in srgb, var(--primary-color) 25%, transparent);
        border-radius: 50%;
        animation: aboutOrbit 18s linear infinite;
    }
    .about-orbit-ring::before {
        content: "";
        position: absolute;
        top: 9px;
        left: 2px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--primary-color);
        opacity: .45;
        box-shadow: 0 0 12px var(--primary-color);
    }
    .about-floating-database {
        position: absolute;
        top: 18px;
        left: 20px;
        color: var(--primary-color);
        font-size: 2.65rem;
        line-height: 1;
        opacity: .22;
        filter: drop-shadow(0 5px 12px color-mix(in srgb, var(--primary-color) 32%, transparent));
        animation: aboutFloat 5.8s ease-in-out infinite;
    }
    .about-floating-sparkle {
        position: absolute;
        right: 2px;
        bottom: 11px;
        color: var(--primary-color);
        font-size: 1rem;
        opacity: .34;
        animation: aboutTwinkle 3.8s ease-in-out infinite;
    }
    .about-orbit-dot {
        position: absolute;
        right: 7px;
        top: 17px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--primary-color);
        opacity: .42;
        animation: aboutFloat 4.6s ease-in-out infinite reverse;
    }
    @keyframes technologyFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
    }
    @keyframes aboutFloat {
        0%, 100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-8px) rotate(4deg); }
    }
    @keyframes aboutOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    @keyframes aboutTwinkle {
        0%, 100% { opacity: .22; transform: scale(.88) rotate(-8deg); }
        50% { opacity: .52; transform: scale(1.12) rotate(8deg); }
    }
    @media (max-width: 760px) {
        .hero-tech-strip { gap: .65rem !important; padding-bottom: 16px; }
        .tech-logo { width: 39px; height: 39px; padding: 6px; }
        .about-orbit-decoration { top: 16px; right: 16px; transform: scale(.88); transform-origin: top right; }
    }
    @media (prefers-reduced-motion: reduce) {
        .tech-logo, .about-orbit-ring, .about-floating-database, .about-floating-sparkle, .about-orbit-dot {
            animation: none !important;
        }
    }


    /* Habilidades: ícones com legendas */

            0 8px 20px color-mix(in srgb,var(--primary-color) 9%,var(--shadow-color)),
